<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vigas site footer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<footer style="width:100%;font-family:Inter,system-ui,sans-serif;color:#EFEAE1;background:#0F0E0C;border-top:1px solid rgba(239,234,225,.075);-webkit-font-smoothing:antialiased;overflow:hidden">
  <div style="max-width:1320px;margin:0 auto;padding:64px clamp(16px,4vw,32px) 28px">
    <div style="display:flex;flex-wrap:wrap;gap:36px 28px">
      <div style="flex:2 1 300px;min-width:0">
        <a href="Main.dc.html" aria-label="Vigas home" style="display:inline-flex;align-items:center;gap:10px;color:#EFEAE1;text-decoration:none">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="#FF6A1A" aria-hidden="true"><rect x="2.5" y="3" width="19" height="2.6" rx=".6"></rect><path d="M4 6.4h16l-1 1.6H5z"></path><rect x="5.2" y="9" width="2.4" height="9" rx=".3"></rect><rect x="10.8" y="9" width="2.4" height="9" rx=".3"></rect><rect x="16.4" y="9" width="2.4" height="9" rx=".3"></rect><rect x="3.5" y="18.6" width="17" height="2.4" rx=".6"></rect></svg>
          <span style="font-family:'Instrument Serif',Georgia,serif;font-size:27px;line-height:1">Vigas</span>
        </a>
        <p style="color:#A9A298;max-width:320px;margin:16px 0 18px;font-size:14px;line-height:1.6">The neutral ground for building with AI — one key, honest prices, and the news that matters.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <span style="display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:8px;background:#1C1B18;box-shadow:inset 0 0 0 1px rgba(239,234,225,.075);font:500 12px 'JetBrains Mono',monospace;color:#6FCF73"><span style="width:7px;height:7px;border-radius:50%;background:#6FCF73;display:inline-block"></span>All systems normal</span>
          <a href="AndroidHome.dc.html" style="display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:8px;background:#1C1B18;box-shadow:inset 0 0 0 1px rgba(239,234,225,.14);font-size:12px;color:#EFEAE1;text-decoration:none"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" style="stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round" aria-hidden="true"><path d="M8 3h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM11 18h2"></path></svg>Android app</a>
        </div>
      </div>
      <sc-for list="{{cols}}" as="col" hint-placeholder-count="5">
        <nav aria-label="{{col.title}}" style="flex:1 1 150px;min-width:0;display:flex;flex-direction:column;gap:11px">
          <span style="font:500 12px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#958E84;margin-bottom:4px">{{col.title}}</span>
          <sc-for list="{{col.links}}" as="l" hint-placeholder-count="5">
            <a href="{{l.href}}" style="color:#A9A298;font-size:14px;text-decoration:none">{{l.label}}</a>
          </sc-for>
        </nav>
      </sc-for>
    </div>
    <div aria-hidden="true" style="font-family:'Instrument Serif',Georgia,serif;font-size:clamp(120px,24vw,340px);line-height:.8;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1px rgba(239,234,225,.14);text-align:center;margin:56px 0 22px;user-select:none">Vigas</div>
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:12px 'JetBrains Mono',monospace;color:#958E84;border-top:1px solid rgba(239,234,225,.075);padding-top:18px">
      <span>© 2026 Vigas Labs · Made with sand &amp; signal</span>
      <span style="display:flex;gap:14px"><a href="#" style="color:#EFEAE1;text-decoration:none">English</a><a href="#" lang="fa" style="color:#958E84;text-decoration:none">فارسی</a><a href="#" style="color:#958E84;text-decoration:none">Privacy</a><a href="#" style="color:#958E84;text-decoration:none">Terms</a></span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const L = (arr, href) => arr.map((label) => ({ label, href }));
    return {
      cols: [
        { title: 'Models', links: L(['Anthropic models', 'OpenAI models', 'Google models', 'Open-weight models', 'Free models', 'Pricing'], 'Models.dc.html') },
        { title: 'Leaderboards', links: L(['Best overall agents', 'Best coding agents', 'Best WebDev models', 'Best text models', 'Best image edit', 'Methodology'], 'Leaderboard.dc.html') },
        { title: 'News', links: L(['Models', 'Agents', 'Analysis', 'Policy', 'Hardware', 'Funding'], 'News.dc.html') },
        { title: 'Tools', links: L(['AI coding tools', 'AI image generators', 'AI video tools', 'AI voice & audio', 'Research assistants', 'Submit a tool'], 'Tools.dc.html') },
        { title: 'Developers', links: [{ label: 'API docs', href: 'Models.dc.html' }, { label: 'Quickstart', href: 'Models.dc.html' }, { label: 'Vigas Chat', href: 'Chat.dc.html' }, { label: 'RetroBuild', href: 'RetroBuild.dc.html' }, { label: 'Status', href: '#' }, { label: 'Changelog', href: '#' }] }
      ]
    };
  }
}
</script>
</body>
</html>
