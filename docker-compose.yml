# Full local stack: Postgres, migrations + seed, API gateway, website.
#   docker compose up --build
# Website: http://localhost:3000 · Gateway: http://localhost:8787
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vigas
      POSTGRES_PASSWORD: vigas
      POSTGRES_DB: vigas
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigas"]
      interval: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: deploy/migrate.Dockerfile }
    environment:
      DATABASE_URL: postgres://vigas:vigas@postgres:5432/vigas
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    build: { context: ., dockerfile: deploy/gateway.Dockerfile }
    environment:
      DATABASE_URL: postgres://vigas:vigas@postgres:5432/vigas
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-token-change-me}
      MOCK_PROVIDERS: "true"
      NODE_ENV: development
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports: ["8787:8787"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ., dockerfile: deploy/web.Dockerfile }
    environment:
      DATABASE_URL: postgres://vigas:vigas@postgres:5432/vigas
      GATEWAY_URL: http://gateway:8787
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-token-change-me}
      PAYMENT_PROVIDER: test
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      gateway: { condition: service_started }

volumes:
  pgdata:
