name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vigas
          POSTGRES_PASSWORD: vigas
          POSTGRES_DB: vigas
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U vigas" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://vigas:vigas@localhost:5433/vigas
      TEST_DATABASE_URL: postgres://vigas:vigas@localhost:5433/vigas_test
      TEST_ADMIN_DATABASE_URL: postgres://vigas:vigas@localhost:5433/postgres
      NEXT_PUBLIC_SITE_URL: https://vigas.ai
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: psql postgres://vigas:vigas@localhost:5433/postgres -c "CREATE DATABASE vigas_test"
      - name: Migrate and seed
        run: pnpm db:migrate && SEED_DEMO_USER=false pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  android-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/mobile
        run: npx tsc --noEmit
      - name: Bundle the Android JavaScript
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir ../../.expo-export
